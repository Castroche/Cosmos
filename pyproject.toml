[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-quant"
version = "1.0.0"
description = "Explainable crypto quantitative trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ccxt>=4.5,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "keyring>=25.6,<26",
  "numpy>=2,<3",
  "scikit-learn>=1.7,<2",
  "threadpoolctl>=3.6,<4",
  "lightgbm>=4.6,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
